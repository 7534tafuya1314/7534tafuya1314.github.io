<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<title>钥匣</title>
<style>
  :root {
    --canvas: #FFFFFF;
    --card: #F5F5F6;
    --ink: #111111;
    --muted: #9A9A9F;
    --line: #EDEDED;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #000000;
      --card: #1C1C1E;
      --ink: #FFFFFF;
      --muted: #8E8E93;
      --line: #2C2C2E;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-weight: 400;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 24px 24px;
  }

  main { padding-top: 12px; }

  h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--ink);
    margin-bottom: 14px;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 22px;
  }

  .label {
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .value {
    margin-top: 10px;
    font-size: clamp(34px, 10vw, 56px);
    font-weight: 800;
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
    word-break: break-all;
  }

  footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: grid;
    gap: 8px;
    font-size: 12px;
  }

  @media (max-width: 420px) {
    .page { padding: 16px 18px 20px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>
<div class="page">

  <main>
    <h1>钥匣</h1>
    <section class="card">
      <div class="label">办匙</div>
      <div class="value" id="passkey">—</div>
    </section>
  </main>

  <footer>
    <span>软件名：API自定义</span>
    <span>版本：1.25v</span>
    <span>开发者：nihao,世界</span>
    <span>关于：感谢支持，祝你游玩愉快；</span>
  </footer>

</div>
<script>
  fetch('key.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (response) {
      if (!response.ok) { throw new Error('HTTP ' + response.status); }
      return response.text();
    })
    .then(function (text) {
      var matched = text.match(/\d+/);
      document.getElementById('passkey').textContent = matched ? matched[0] : '—';
    })
    .catch(function () {
      document.getElementById('passkey').textContent = '—';
    });
</script>
</body>
</html>
